# Stage 4 — SimPO QLoRA config (paper-exact hparams, gbr=0.5)
# Uses TRL CPOTrainer with loss_type="simpo" (TRL >= 0.9.0 required)
# Paper defaults: beta=2.0, simpo_gamma=1.0 → gamma/beta = 0.5
# Reference-free: no reference model → ~5GB less VRAM vs vanilla DPO
#
# learning_rate is 5e-7 = the SimPO paper value. Keep it there.
# NOTE: an earlier writeup (results/dpo17_simpo_collapse.md) claimed lr=5e-6 was THE cause
# of the v1 token-soup collapse. That was never validated — the symptom has multiple
# independent triggers (empty-completion 0/0 NaN; gradient explosion at epoch ~0.97 even
# at lr=5e-7). Do not treat that doc as settled. No clean SimPO run reproduced yet.

# Model — same SFT checkpoint as DPO (controlled comparison)
model_name_or_path: checkpoints/sft-zephyr-lora/checkpoint-17205
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# LoRA — same as DPO for apples-to-apples
use_peft: true
load_in_4bit: false  # A100 80GB has headroom for bf16; matches dpo_vanilla_qlora.yaml for apples-to-apples comparison
lora_r: 128
lora_alpha: 128
lora_dropout: 0.05
use_rslora: false  # REVERTED 2026-06-06: at fixed r=128 this is just an 11x scalar bump
                   # (alpha/r=1.0 -> alpha/sqrt(r)=11.3), which made grad_norm climb
                   # 178->282 in warmup. rsLoRA fixes grad SUPPRESSION when VARYING rank;
                   # our problem is grad EXPLOSION at fixed rank, so it's the wrong lever.
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

# Data — identical to DPO (controlled comparison)
dataset_mixer:
  argilla/ultrafeedback-binarized-preferences-cleaned: 1.0
dataset_splits:
- train[2%:]   # ~59.7K training examples (argilla cleaned UF has no test split — carve from train)
- train[:2%]   # ~1.2K eval examples (held-out, same 98/2 split as DPO config)
dataset_num_proc: 12

# CPOTrainer (SimPO)
loss_type: simpo
bf16: true
beta: 2.0            # SimPO paper default
simpo_gamma: 1.0     # gamma/beta = 0.5 (paper default gbr)
do_eval: true
eval_strategy: steps
eval_steps: 250      # quality curve at ~half the eval overhead of 100 (3-epoch run)
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 5.0e-7   # SimPO paper value (not DPO's 5e-6; lr's role in v1 collapse unconfirmed)
max_grad_norm: 1.0      # (a) preventive: in the v2 run grad_norm climbed 12->30 then NaN'd
                        # at epoch ~0.97. Clipping each finite-but-large update MAY stop the
                        # climb before the cliff. It CANNOT repair an already-NaN gradient
                        # (NaN survives clipping) — that's what the NaN-guard trainer is for.
log_level: info
logging_steps: 10
lr_scheduler_type: cosine
max_length: 1024
max_prompt_length: 512
num_train_epochs: 3   # LoRA under-fits in 1 pass; 3 epochs. The step-3613 NaN was H_data
                       # (0/0 from a truncated Oriya row), now fixed by drop_empty_completion_rows
                       # — so the full 3-epoch run can finally complete. Pick best epoch by eval.
optim: paged_adamw_32bit
output_dir: checkpoints/simpo-gbr05-fixed
per_device_train_batch_size: 4
per_device_eval_batch_size: 8
push_to_hub: false
report_to: none
save_strategy: epoch  # one resumable checkpoint per epoch (3 total) -> compare epochs &
                      # pick the best by eval; resume if a 24h run dies late.
save_steps: 500       # ignored under save_strategy=epoch
save_total_limit: 3   # keep all 3 epoch checkpoints
seed: 42
warmup_ratio: 0.1
